      <rect x="258" y="666" width="68" height="26" rx="9"/>
      <rect x="674" y="308" width="68" height="26" rx="9"/>
      <rect x="674" y="666" width="68" height="26" rx="9"/>
    </g>
    <path d="M476 348H520L448 500H520L448 652" stroke="url(#icnAmber)" stroke-width="70" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
    <path d="M588 500H624L584 652H548L588 500Z" fill="#F8FAFC" fill-opacity="0.78"/>
  </g>

  <g>
    <g class="letter-0"><text x="1030" y="420" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, sans-serif" font-size="250" font-weight="750" letter-spacing="0">T</text></g>
    <g class="letter-1"><text x="1240" y="420" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, sans-serif" font-size="250" font-weight="750" letter-spacing="0">i</text></g>
    <g class="letter-2"><text x="1360" y="420" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, sans-serif" font-size="250" font-weight="750" letter-spacing="0">n</text></g>
    <g class="letter-3"><text x="1580" y="420" fill="#0F172A" font-family="Inter, -apple-system, BlinkMacSystemFont, &apos;Segoe UI&apos;, sans-serif" font-size="250" font-weight="750" letter-spacing="0">y</text></g>
  </g>
  <path d="M1030 470H1690" stroke="#F59E0B" stroke-width="18" stroke-linecap="round"/>
