<svg width="3000" height="1000" viewBox="0 0 3000 1000" fill="none" xmlns="http://www.w3.org/2000/svg">
  <style>
    @keyframes wave {
      0%, 100% { transform: translateY(0); }
      25% { transform: translateY(-30px); }
      50% { transform: translateY(0); }
    }
    .letter-0 { animation: wave 1.8s ease-in-out infinite; animation-delay: 0s; }
    .letter-1 { animation: wave 1.8s ease-in-out infinite; animation-delay: 0.12s; }
    .letter-2 { animation: wave 1.8s ease-in-out infinite; animation-delay: 0.24s; }
    .letter-3 { animation: wave 1.8s ease-in-out infinite; animation-delay: 0.36s; }
    .letter-4 { animation: wave 1.8s ease-in-out infinite; animation-delay: 0.48s; }
    .letter-5 { animation: wave 1.8s ease-in-out infinite; animation-delay: 0.60s; }
    .letter-6 { animation: wave 1.8s ease-in-out infinite; animation-delay: 0.72s; }
    .letter-7 { animation: wave 1.8s ease-in-out infinite; animation-delay: 0.84s; }
    .icon-bob { animation: wave 1.8s ease-in-out infinite; animation-delay: 0.06s; }
  </style>

  <defs>
    <linearGradient id="icnInk" x1="190" y1="150" x2="810" y2="850" gradientUnits="userSpaceOnUse">
      <stop stop-color="#1E293B"/>
      <stop offset="1" stop-color="#020617"/>
    </linearGradient>
    <linearGradient id="icnAmber" x1="330" y1="340" x2="690" y2="690" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FBBF24"/>
      <stop offset="1" stop-color="#D97706"/>
    </linearGradient>
    <radialGradient id="icnGlow" cx="0.5" cy="0.5" r="0.5">
      <stop stop-color="#22D3EE" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#22D3EE" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <g class="icon-bob">
    <rect x="100" y="100" width="800" height="800" rx="145" fill="url(#icnInk)"/>
    <rect x="143" y="143" width="714" height="714" rx="111" stroke="#FBBF24" stroke-opacity="0.16" stroke-width="14"/>
    <circle cx="662" cy="272" r="30" fill="#2DD4BF"/>
    <circle cx="662" cy="272" r="88" fill="#22D3EE" fill-opacity="0.10"/>
    <g stroke="url(#icnAmber)" stroke-width="40" stroke-linecap="square">
      <path d="M262 348V652"/>
